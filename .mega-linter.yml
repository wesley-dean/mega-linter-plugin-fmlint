---
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - dist
  - report
  - megalinter-reports
  - test-results
  - doc/standards

FILTER_REGEX_EXCLUDE: '(^|/)(dist|test-results|doc/standards)/'

IGNORE_GITIGNORED_FILES: true

DISABLE_LINTERS:
  [
    REPOSITORY_DEVSKIM,
    REPOSITORY_DUSTILOCK,
    SPELL_MISSPELL,
    SPELL_PROSELINT,
    SPELL_LYCHEE,
    COPYPASTE_JSCPD,
  ]

VALIDATE_ALL_CODEBASE: false
PRINT_ALPACA: false
SARIF_REPORTER: true
DISABLE_ERRORS: true
JAVASCRIPT_DEFAULT_STYLE: prettier
REPOSITORY_GITLEAKS_ARGUMENTS: --no-git
REPOSITORY_DEVSKIM_ARGUMENTS: "--skip-git-ignored-files"
BASH_SHFMT_ARGUMENTS: -i 2 -bn -ci -sr -kp
REPOSITORY_TRUFFLEHOG_ARGUMENTS: "--exclude-paths=.trufflehogignore"
SPELL_CSPELL_ANALYZE_FILE_NAMES: false
SPELL_CSPELL_FILE_EXTENSIONS:
  - ".md"
CLEAR_REPORT_FOLDER: true
